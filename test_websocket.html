<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test WebSocket COFINANCE CI</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        #chat-log { width: 100%; height: 300px; border: 1px solid #ccc; padding: 10px; overflow-y: scroll; margin-bottom: 10px; background-color: #f9f9f9; }
        input[type="text"] { width: calc(100% - 90px); padding: 10px; }
        button { width: 80px; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .system-msg { color: #888; font-style: italic; }
        .user-msg { color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Chat Support (Test WebSocket)</h2>
    <div id="chat-log"></div>
    <input id="chat-message-input" type="text" placeholder="Tapez un message ici..."><br>
    <button id="chat-message-submit">Envoyer</button>

    <script>
        // On se connecte à la conversation ID 1
        const chatSocket = new WebSocket('ws://127.0.0.1:8000/ws/chat/1/');
        const chatLog = document.querySelector('#chat-log');

        chatSocket.onopen = function(e) {
            chatLog.innerHTML += '<p class="system-msg">[Système] Connecté au serveur WebSocket !</p>';
        };

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            chatLog.innerHTML += '<p><span class="user-msg">Utilisateur ' + data.user_id + ' :</span> ' + data.message + '</p>';
            chatLog.scrollTop = chatLog.scrollHeight; // Scroll vers le bas
        };

        chatSocket.onclose = function(e) {
            chatLog.innerHTML += '<p class="system-msg">[Système] Connexion fermée de manière inattendue.</p>';
        };

        document.querySelector('#chat-message-input').focus();
        document.querySelector('#chat-message-input').onkeyup = function(e) {
            if (e.key === 'Enter') {  // Envoi avec la touche Entrée
                document.querySelector('#chat-message-submit').click();
            }
        };

        document.querySelector('#chat-message-submit').onclick = function(e) {
            const messageInputDom = document.querySelector('#chat-message-input');
            const message = messageInputDom.value;
            
            // On envoie le message au serveur (avec un faux user_id pour le test)
            chatSocket.send(JSON.stringify({
                'message': message,
                'user_id': 99 // Faux ID pour le test
            }));
            
            messageInputDom.value = '';
        };
    </script>
</body>
</html>
